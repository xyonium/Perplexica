services:
  searxng:
    image: docker.io/searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng:rw
    ports:
      - 4000:8080
    networks:
      - reverse-proxy
    restart: unless-stopped

  app:
    image: itzcrazykns1337/perplexica:main
    #build:
    #  context: .
    #  dockerfile: app.dockerfile
    environment:
      - SEARXNG_API_URL=http://searxng:8080
      - DATA_DIR=/home/perplexica
    ports:
      - 3000:3000
    networks:
      - reverse-proxy
    volumes:
      - backend-dbstore:/home/perplexica/data
      - uploads:/home/perplexica/uploads
      - ./config.toml:/home/perplexica/config.toml
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.perplexica.rule=Host(`aisearch.example.com`)"
      - "traefik.http.routers.perplexica.entrypoints=websecure"
      - "traefik.http.routers.perplexica.tls.certresolver=myresolver"
      - "traefik.http.routers.perplexica.tls.domains[0].main=example.com"
      - "traefik.http.routers.perplexica.tls.domains[0].sans=*.example.com"
      - "traefik.http.routers.perplexicahttp.rule=Host(`aisearch.example.com`)"
      - "traefik.http.routers.perplexicahttp.entrypoints=web"
      - "traefik.docker.network=reverse-proxy"

networks:
  reverse-proxy:
    name: reverse-proxy
    external: true

volumes:
  backend-dbstore:
  uploads:
